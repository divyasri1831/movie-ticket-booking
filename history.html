<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub - Booking History</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: #111118;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff3b3b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff3b3b;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-card {
            background: #17171f;
            border: 1px solid #292933;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .movie {
            color: #ff3b3b;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            color: #ccc;
        }

        .details strong {
            color: white;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 50px 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #ff3b3b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {
            .details {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 18px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🎬 MovieHub</div>

        <div>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="history.html">Bookings</a>
        </div>
    </nav>

    <div class="container">

        <h1>🎟️ Booking History</h1>

        <div id="history"></div>

    </div>

    <footer>
        © 2026 MovieHub | Movie Ticket Booking System
    </footer>


    <script>

        const historyContainer =
            document.getElementById("history");

        const booking =
            JSON.parse(
                sessionStorage.getItem("movieHubBooking")
            );


        if (!booking) {

            historyContainer.innerHTML = `
                <div class="empty">
                    <h2>No bookings yet 🎬</h2>
                    <p>Book a movie to see your booking history here.</p>

                    <a href="movies.html" class="btn">
                        Browse Movies
                    </a>
                </div>
            `;

        } else {

            historyContainer.innerHTML = `

                <div class="booking-card">

                    <div class="movie">
                        🎬 ${booking.movie || "Movie"}
                    </div>

                    <div class="details">

                        <div>
                            <strong>Theatre:</strong>
                            ${booking.theatre || "N/A"}
                        </div>

                        <div>
                            <strong>Date:</strong>
                            ${booking.date || "N/A"}
                        </div>

                        <div>
                            <strong>Show:</strong>
                            ${booking.show || "N/A"}
                        </div>

                        <div>
                            <strong>Seats:</strong>
                            ${booking.seats || "N/A"}
                        </div>

                        <div>
                            <strong>Category:</strong>
                            ${booking.category || "N/A"}
                        </div>

                        <div>
                            <strong>Amount:</strong>
                            ₹${booking.finalAmount || booking.total || 0}
                        </div>

                    </div>

                </div>
            `;
        }

    </script>

</body>
</html>
