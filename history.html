<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub - Booking History</title>

    <link rel="stylesheet" href="theme.css">
    <script src="theme.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: #111118;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff3b3b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        nav a:hover {
            color: #ff3b3b;
        }

        #themeButton {
            margin-left: 18px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #292933;
            color: white;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-card {
            background: #17171f;
            border: 1px solid #292933;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .movie {
            color: #ff3b3b;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            color: #ccc;
        }

        .details strong {
            color: white;
        }

        .booking-id {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #292933;
            color: #aaa;
        }

        .amount {
            color: #4caf50;
            font-weight: bold;
        }

        .cancel-btn {
            margin-top: 20px;
            background: #ff3b3b;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel-btn:hover {
            background: #d92929;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 50px 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #ff3b3b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .success-message {
            text-align: center;
            background: #173b20;
            color: #4caf50;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 700px) {

            nav {
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 8px;
                font-size: 13px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">
            🎬 MovieHub
        </div>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="movies.html">
                Movies
            </a>

            <a href="history.html">
                Bookings
            </a>

            <a href="reviews.html">
                ⭐ Reviews
            </a>

            <a href="offers.html">
                🎁 Offers
            </a>

            <button
                id="themeButton"
                onclick="toggleTheme()">

                ☀️ Light

            </button>

        </div>

    </nav>


    <div class="container">

        <h1>
            🎟️ Booking History
        </h1>


        <div
            id="successMessage"
            class="success-message">

            ✅ Booking cancelled successfully!

        </div>


        <div id="history"></div>

    </div>


    <footer>

        © 2026 MovieHub |
        Movie Ticket Booking System

    </footer>


    <script>

        function displayHistory() {

            const historyContainer =
                document.getElementById(
                    "history"
                );


            const bookingHistory =
                JSON.parse(
                    localStorage.getItem(
                        "movieHubBookingHistory"
                    )
                ) || [];


            if (bookingHistory.length === 0) {

                historyContainer.innerHTML = `

                    <div class="empty">

                        <h2>
                            No bookings yet 🎬
                        </h2>

                        <p>
                            Book a movie to see your
                            booking history here.
                        </p>

                        <a
                            href="movies.html"
                            class="btn">

                            Browse Movies

                        </a>

                    </div>

                `;

                return;

            }


            historyContainer.innerHTML = "";


            bookingHistory.forEach(
                (booking, index) => {

                    historyContainer.innerHTML += `

                        <div class="booking-card">

                            <div class="movie">

                                🎬
                                ${booking.movie || "Movie"}

                            </div>


                            <div class="details">

                                <div>

                                    <strong>
                                        Theatre:
                                    </strong>

                                    ${booking.theatre || "N/A"}

                                </div>


                                <div>

                                    <strong>
                                        Date:
                                    </strong>

                                    ${booking.date || "N/A"}

                                </div>


                                <div>

                                    <strong>
                                        Show:
                                    </strong>

                                    ${booking.show || "N/A"}

                                </div>


                                <div>

                                    <strong>
                                        Seats:
                                    </strong>

                                    ${booking.seats || "N/A"}

                                </div>


                                <div>

                                    <strong>
                                        Category:
                                    </strong>

                                    ${booking.category || "N/A"}

                                </div>


                                <div>

                                    <strong>
                                        Amount:
                                    </strong>

                                    <span class="amount">

                                        ₹${booking.finalAmount || booking.total || 0}

                                    </span>

                                </div>

                            </div>


                            <div class="booking-id">

                                Booking ID:

                                <strong>

                                    ${booking.bookingId || "N/A"}

                                </strong>

                            </div>


                            <button
                                class="cancel-btn"
                                onclick="cancelBooking(${index})">

                                ❌ Cancel Booking

                            </button>

                        </div>

                    `;

                }
            );

        }


        function cancelBooking(index) {

            const confirmCancel =
                confirm(
                    "Are you sure you want to cancel this booking?"
                );


            if (!confirmCancel) {

                return;

            }


            let bookingHistory =
                JSON.parse(
                    localStorage.getItem(
                        "movieHubBookingHistory"
                    )
                ) || [];


            bookingHistory.splice(
                index,
                1
            );


            localStorage.setItem(
                "movieHubBookingHistory",
                JSON.stringify(
                    bookingHistory
                )
            );


            document.getElementById(
                "successMessage"
            ).style.display = "block";


            displayHistory();


            setTimeout(() => {

                document.getElementById(
                    "successMessage"
                ).style.display = "none";

            }, 3000);

        }


        displayHistory();

    </script>

</body>

</html>
