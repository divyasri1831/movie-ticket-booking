<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MovieHub Admin Dashboard</title>

  <link rel="stylesheet" href="theme.css">
  <script src="theme.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    nav {
      background: #181818;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    nav h2 {
      margin: 0;
      color: #ff3b3b;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    nav a:hover {
      color: #ff3b3b;
    }

    #themeButton {
      margin-left: 18px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h1 {
      color: #ff3b3b;
      margin-bottom: 8px;
    }

    .title p {
      color: #aaa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #333;
    }

    .stat-card .icon {
      font-size: 35px;
    }

    .stat-card h3 {
      margin: 10px 0;
      font-size: 30px;
      color: #ff3b3b;
    }

    .stat-card p {
      margin: 0;
      color: #aaa;
    }

    .section {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      border: 1px solid #333;
    }

    .section h2 {
      margin-top: 0;
      color: #ff3b3b;
    }

    .movie-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      margin-bottom: 10px;
      background: #252525;
      border-radius: 10px;
    }

    .movie-name {
      font-weight: bold;
    }

    .booking-card {
      background: #252525;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .booking-card strong {
      color: #ff3b3b;
    }

    .booking-card p {
      margin: 6px 0;
      color: #ccc;
    }

    .empty {
      color: #aaa;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      nav {
        flex-direction: column;
        gap: 15px;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      nav a {
        margin-left: 8px;
        font-size: 14px;
      }

      .movie-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <h2>🎬 MovieHub Admin</h2>

    <div>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="history.html">Bookings</a>
      <button id="themeButton" onclick="toggleTheme()">☀️ Light</button>
    </div>
  </nav>

  <div class="container">

    <div class="title">
      <h1>📊 Admin Dashboard</h1>
      <p>MovieHub Management Overview</p>
    </div>

    <!-- STATISTICS -->

    <div class="stats">

      <div class="stat-card">
        <div class="icon">🎬</div>
        <h3 id="totalMovies">0</h3>
        <p>Total Movies</p>
      </div>

      <div class="stat-card">
        <div class="icon">🎟️</div>
        <h3 id="totalBookings">0</h3>
        <p>Total Bookings</p>
      </div>

      <div class="stat-card">
        <div class="icon">💰</div>
        <h3>₹<span id="totalRevenue">0</span></h3>
        <p>Total Revenue</p>
      </div>

      <div class="stat-card">
        <div class="icon">⭐</div>
        <h3 id="totalReviews">0</h3>
        <p>Total Reviews</p>
      </div>

    </div>

    <!-- POPULAR MOVIES -->

    <div class="section">

      <h2>🔥 Popular Movies</h2>

      <div id="popularMovies"></div>

    </div>

    <!-- RECENT BOOKINGS -->

    <div class="section">

      <h2>📋 Recent Bookings</h2>

      <div id="recentBookings"></div>

    </div>

  </div>

  <script>

    const movies = [
      "Paradise",
      "Salaar 2",
      "Fauzi",
      "Spirit"
    ];

    const bookings =
      JSON.parse(
        localStorage.getItem("movieHubBookingHistory")
      ) || [];

    const reviews =
      JSON.parse(
        localStorage.getItem("movieHubReviews")
      ) || [];


    // TOTAL MOVIES

    document.getElementById("totalMovies").textContent =
      movies.length;


    // TOTAL BOOKINGS

    document.getElementById("totalBookings").textContent =
      bookings.length;


    // TOTAL REVIEWS

    document.getElementById("totalReviews").textContent =
      reviews.length;


    // TOTAL REVENUE

    let revenue = 0;

    bookings.forEach(function(booking) {

      revenue += Number(
        booking.finalAmount || booking.total || 0
      );

    });

    document.getElementById("totalRevenue").textContent =
      revenue;


    // POPULAR MOVIES

    const movieCounts = {};

    movies.forEach(function(movie) {
      movieCounts[movie] = 0;
    });

    bookings.forEach(function(booking) {

      if (movieCounts[booking.movie] !== undefined) {
        movieCounts[booking.movie]++;
      }

    });

    const popularMovies =
      document.getElementById("popularMovies");

    const sortedMovies =
      Object.entries(movieCounts)
        .sort(function(a, b) {
          return b[1] - a[1];
        });


    if (bookings.length === 0) {

      popularMovies.innerHTML =
        '<div class="empty">No booking data available yet.</div>';

    } else {

      sortedMovies.forEach(function(item) {

        const movieName = item[0];
        const count = item[1];

        const row =
          document.createElement("div");

        row.className = "movie-row";

        row.innerHTML =
          "<span class='movie-name'>🎬 " +
          movieName +
          "</span>" +
          "<span>🎟️ " +
          count +
          " booking(s)</span>";

        popularMovies.appendChild(row);

      });

    }


    // RECENT BOOKINGS

    const recentBookings =
      document.getElementById("recentBookings");


    if (bookings.length === 0) {

      recentBookings.innerHTML =
        '<div class="empty">No bookings available yet.</div>';

    } else {

      bookings.slice(0, 5).forEach(function(booking) {

        const card =
          document.createElement("div");

        card.className = "booking-card";

        card.innerHTML =

          "<p><strong>🎬 Movie:</strong> " +
          (booking.movie || "Movie") +
          "</p>" +

          "<p><strong>🏢 Theatre:</strong> " +
          (booking.theatre || "Theatre") +
          "</p>" +

          "<p><strong>📅 Date:</strong> " +
          (booking.date || "Date") +
          "</p>" +

          "<p><strong>⏰ Show:</strong> " +
          (booking.show || "Show") +
          "</p>" +

          "<p><strong>💺 Seats:</strong> " +
          (booking.seats || "None") +
          "</p>" +

          "<p><strong>💰 Amount:</strong> ₹" +
          (booking.finalAmount || booking.total || 0) +
          "</p>" +

          "<p><strong>🆔 Booking ID:</strong> " +
          (booking.bookingId || "N/A") +
          "</p>";

        recentBookings.appendChild(card);

      });

    }

  </script>

</body>
</html>
