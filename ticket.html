<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub - Digital Ticket</title>

    <link rel="stylesheet" href="theme.css">
    <script src="theme.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: #111118;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff3b3b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        nav a:hover {
            color: #ff3b3b;
        }

        #themeButton {
            margin-left: 18px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #292933;
            color: white;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .ticket {
            background: #17171f;
            border: 1px solid #292933;
            border-radius: 18px;
            padding: 30px;
        }

        .success {
            text-align: center;
            color: #4caf50;
            font-size: 28px;
            margin-bottom: 25px;
        }

        .movie-name {
            text-align: center;
            color: #ff3b3b;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details {
            background: #111118;
            padding: 20px;
            border-radius: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #292933;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #999;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        /* QR SECTION */

        .qr-section {
            text-align: center;
            margin: 30px 0;
        }

        .qr-section h3 {
            margin-bottom: 15px;
        }

        #qrcode {
            width: 200px;
            height: 200px;
            background: white;
            padding: 10px;
            margin: auto;
            border-radius: 12px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img {
            width: 180px;
            height: 180px;
        }

        .booking-id {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .booking-id strong {
            color: white;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button.action {
            background: #ff3b3b;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button.action:hover {
            background: #e52c2c;
        }

        button.home-btn {
            background: #292933;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 700px) {

            nav {
                padding: 18px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 8px;
                font-size: 13px;
            }

            .ticket {
                padding: 20px;
            }

            .movie-name {
                font-size: 25px;
            }

            .row {
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: left;
            }
        }

        @media print {

            nav,
            .buttons,
            footer {
                display: none;
            }

            body {
                background: white;
                color: black;
            }

            .ticket {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">
            🎬 MovieHub
        </div>

        <div>

            <a href="index.html">Home</a>

            <a href="movies.html">Movies</a>

            <a href="history.html">Bookings</a>

            <a href="reviews.html">⭐ Reviews</a>

            <a href="offers.html">🎁 Offers</a>

            <button
                id="themeButton"
                onclick="toggleTheme()">

                ☀️ Light

            </button>

        </div>

    </nav>


    <div class="container">

        <div class="ticket">

            <div class="success">
                ✅ Booking Confirmed!
            </div>


            <div
                class="movie-name"
                id="movie">

                Movie

            </div>


            <div class="details">

                <div class="row">

                    <span class="label">
                        Theatre
                    </span>

                    <span
                        class="value"
                        id="theatre">

                        Theatre

                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Date
                    </span>

                    <span
                        class="value"
                        id="date">

                        Date

                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Show Time
                    </span>

                    <span
                        class="value"
                        id="show">

                        Show Time

                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Seats
                    </span>

                    <span
                        class="value"
                        id="seats">

                        Seats

                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Category
                    </span>

                    <span
                        class="value"
                        id="category">

                        Category

                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Amount Paid
                    </span>

                    <span
                        class="value"
                        id="paidAmount">

                        ₹0

                    </span>

                </div>

            </div>


            <!-- ACTUAL QR CODE -->

            <div class="qr-section">

                <h3>
                    📱 Scan Your Ticket
                </h3>

                <div id="qrcode">
                </div>

            </div>


            <div class="booking-id">

                Booking ID:

                <strong id="bookingId">
                    MH000000
                </strong>

            </div>


            <div class="buttons">

                <button
                    class="action"
                    onclick="window.print()">

                    🖨️ Print Ticket

                </button>


                <button
                    class="action home-btn"
                    onclick="goHome()">

                    🏠 Back to Home

                </button>

            </div>

        </div>

    </div>


    <footer>

        © 2026 MovieHub |
        Movie Ticket Booking System

    </footer>


    <script>

        /*
         * GET BOOKING DATA
         */

        const booking =
            JSON.parse(
                sessionStorage.getItem(
                    "movieHubBooking"
                )
            ) || {};


        /*
         * GENERATE BOOKING ID
         * ONLY ONCE
         */

        if (!booking.bookingId) {

            booking.bookingId =
                "MH" +
                Math.floor(
                    100000 +
                    Math.random() * 900000
                );

        }


        /*
         * SAVE BOOKING
         */

        sessionStorage.setItem(
            "movieHubBooking",
            JSON.stringify(booking)
        );


        /*
         * BOOKING HISTORY
         */

        let bookingHistory =
            JSON.parse(
                localStorage.getItem(
                    "movieHubBookingHistory"
                )
            ) || [];


        const alreadySaved =
            bookingHistory.some(
                item =>
                    item.bookingId ===
                    booking.bookingId
            );


        if (!alreadySaved) {

            bookingHistory.unshift(
                booking
            );

            localStorage.setItem(
                "movieHubBookingHistory",
                JSON.stringify(
                    bookingHistory
                )
            );

        }


        /*
         * DISPLAY BOOKING
         */

        document.getElementById(
            "movie"
        ).textContent =
            booking.movie || "Movie";


        document.getElementById(
            "theatre"
        ).textContent =
            booking.theatre || "Theatre";


        document.getElementById(
            "date"
        ).textContent =
            booking.date || "Date";


        document.getElementById(
            "show"
        ).textContent =
            booking.show || "Show Time";


        document.getElementById(
            "seats"
        ).textContent =
            booking.seats || "No seats";


        document.getElementById(
            "category"
        ).textContent =
            booking.category || "Regular";


        const paidAmount =
            booking.finalAmount ||
            booking.total ||
            0;


        document.getElementById(
            "paidAmount"
        ).textContent =
            "₹" + paidAmount;


        document.getElementById(
            "bookingId"
        ).textContent =
            booking.bookingId;


        /*
         * QR DATA
         */

        const qrData =
            "MovieHub Ticket | " +
            "Movie: " +
            (booking.movie || "Movie") +
            " | Theatre: " +
            (booking.theatre || "Theatre") +
            " | Date: " +
            (booking.date || "Date") +
            " | Show: " +
            (booking.show || "Show") +
            " | Seats: " +
            (booking.seats || "None") +
            " | Category: " +
            (booking.category || "Regular") +
            " | Amount: ₹" +
            paidAmount +
            " | Booking ID: " +
            booking.bookingId;


        /*
         * CREATE ACTUAL QR IMAGE
         */

        const qrImage =
            document.createElement("img");

        qrImage.alt =
            "MovieHub Ticket QR Code";

        qrImage.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
            encodeURIComponent(qrData);


        document.getElementById(
            "qrcode"
        ).appendChild(qrImage);


        /*
         * HOME
         */

        function goHome() {

            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
