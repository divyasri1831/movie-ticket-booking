<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub - Digital Ticket</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: #111118;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff3b3b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff3b3b;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .ticket {
            background: #17171f;
            border: 1px solid #292933;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .success {
            text-align: center;
            color: #4caf50;
            font-size: 28px;
            margin-bottom: 25px;
        }

        .movie-name {
            text-align: center;
            color: #ff3b3b;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details {
            background: #111118;
            padding: 20px;
            border-radius: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #292933;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #999;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        .qr {
            width: 150px;
            height: 150px;
            background: white;
            color: black;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            border-radius: 10px;
        }

        .booking-id {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #ff3b3b;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e52c2c;
        }

        .home-btn {
            background: #292933;
        }

        .home-btn:hover {
            background: #3a3a46;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {
            nav {
                padding: 18px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 14px;
            }

            .ticket {
                padding: 20px;
            }

            .movie-name {
                font-size: 25px;
            }
        }

        @media print {
            nav,
            .buttons,
            footer {
                display: none;
            }

            body {
                background: white;
                color: black;
            }

            .ticket {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
        #themeButton {
    margin-left: 20px;
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: #292933;
    color: white;
    cursor: pointer;
}

#themeButton:hover {
    background: #ff3b3b;
}
    </style>
    <link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
</head>

<body>

    <nav>
        <div class="logo">🎬 MovieHub</div>

        <div>
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="history.html">Bookings</a>
    <a href="reviews.html">⭐ Reviews</a>
    <a href="offers.html">🎁 Offers</a>

    <button id="themeButton" onclick="toggleTheme()">
        ☀️ Light
    </button>
</div>
    </nav>

    <div class="container">

        <div class="ticket">

            <div class="success">
                ✅ Booking Confirmed!
            </div>

            <div class="movie-name" id="movie">
                Movie
            </div>

            <div class="details">

                <div class="row">
                    <span class="label">Theatre</span>
                    <span class="value" id="theatre">
                        Theatre
                    </span>
                </div>

                <div class="row">
                    <span class="label">Date</span>
                    <span class="value" id="date">
                        Date
                    </span>
                </div>

                <div class="row">
                    <span class="label">Show Time</span>
                    <span class="value" id="show">
                        Show Time
                    </span>
                </div>

                <div class="row">
                    <span class="label">Seats</span>
                    <span class="value" id="seats">
                        Seats
                    </span>
                </div>

                <div class="row">
                    <span class="label">Amount Paid</span>
                    <span class="value" id="paidAmount">
                        ₹0
                    </span>
                </div>

            </div>

            <div class="qr">
                ▦
            </div>

            <div class="booking-id">
                Booking ID:
                <strong id="bookingId">MH000000</strong>
            </div>

            <div class="buttons">

                <button onclick="window.print()">
                    🖨️ Print Ticket
                </button>

                <button class="home-btn" onclick="goHome()">
                    🏠 Back to Home
                </button>

            </div>

        </div>

    </div>

    <footer>
        © 2026 MovieHub | Movie Ticket Booking System
    </footer>


    <script>

        const booking = JSON.parse(
            sessionStorage.getItem("movieHubBooking")
        ) || {};


        document.getElementById("movie").textContent =
            booking.movie || "Movie";


        document.getElementById("theatre").textContent =
            booking.theatre || "Theatre";


        document.getElementById("date").textContent =
            booking.date || "Date";


        document.getElementById("show").textContent =
            booking.show || "Show Time";


        document.getElementById("seats").textContent =
            booking.seats || "No seats";


        document.getElementById("paidAmount").textContent =
            "₹" + (booking.finalAmount || booking.total || 0);


        function generateBookingId() {

            const number =
                Math.floor(100000 + Math.random() * 900000);

            document.getElementById("bookingId").textContent =
                "MH" + number;
        }


        function goHome() {

            window.location.href = "index.html";

        }


        generateBookingId();

    </script>

</body>
</html>
